[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "osmfeatures"
version = "0.4.0"
description = "Official client for the MapLark OSM Features API (GeoJSON, FlatGeobuf, GeoParquet, CSV)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["openstreetmap", "osm", "geojson", "flatgeobuf", "geoparquet", "overpass", "maplark", "geospatial", "maps", "mcp", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
    "Typing :: Typed",
]
dependencies = [
    "requests>=2.28",
    "httpx>=0.27",
    "click>=8.1",
    "geojson>=3.0",
]

[project.optional-dependencies]
geo = [
    "pandas>=2.0",
    "geopandas>=0.14",
    "shapely>=2.0",
]
mcp = ["mcp>=1.8,<2"]
all = [
    "pandas>=2.0",
    "geopandas>=0.14",
    "shapely>=2.0",
    "mcp>=1.8,<2",
]
test = [
    "pytest>=7.0",
    "responses>=0.25",
    "pytest-asyncio>=0.23",
    "networkx>=3.0",
    "haversine>=2.8",
    "python-dotenv>=1.0",
]

[project.scripts]
osmfeatures = "osmfeatures.cli:cli"

[project.urls]
Homepage = "https://maplark.com"
Repository = "https://github.com/MapLark/osmfeatures-python"

[tool.hatch.build.targets.wheel]
packages = ["src/osmfeatures"]
include = ["src/osmfeatures/py.typed", "src/osmfeatures/mcp/AGENT_INSTRUCTIONS.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.mypy]
strict = true
